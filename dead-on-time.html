<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DEAD ON TIME</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #020704;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Space Mono', monospace;
  }
  #gameCanvas {
    display: block;
    cursor: crosshair;
    border: 1px solid rgba(0,255,136,0.12);
    box-shadow: 0 0 60px rgba(0,255,136,0.08), inset 0 0 60px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width  = Math.min(820, window.innerWidth);
const H = canvas.height = Math.min(560, window.innerHeight - 10);

// ─── State ──────────────────────────────────────────────────────────────────
let gs = 'menu'; // menu | playing | gameover
let wave = 1, score = 0, highScore = 0;
let enemies = [], particles = [], slashFX = [], floatTexts = [];
let waveBreak = false, waveTimer = 0;
let mouse = { x: W / 2, y: H / 2 };
let deathMsg = '';
const DEATH_MSGS = [
  "Time has won. How deeply ironic.",
  "The deadline... met you first.",
  "Your timeline flatlined. Classic.",
  "The minutes demanded overtime.",
  "You had ONE job: kill time.",
  "Clocked out. Permanently.",
  "Turns out time kills back.",
];

const player = {
  x: W / 2, y: H / 2,
  r: 18, speed: 2.8,
  hp: 100, maxHp: 100,
  atkR: 95,
  cd: 0, maxCd: 22,
  angle: 0,
};

// ─── Enemy Templates ─────────────────────────────────────────────────────────
const TYPES = {
  minute: { label:'Minute Zombie', r:11, spd:1.4, maxHp:1,  col:'#7fff00', val:1,    glow:'#aaff00' },
  hour:   { label:'Hour Undead',   r:20, spd:0.9, maxHp:4,  col:'#ffd700', val:60,   glow:'#ffee44' },
  day:    { label:'Day Wraith',    r:30, spd:0.55,maxHp:10, col:'#ff6622', val:1440, glow:'#ff8844' },
  boss:   { label:'Wasted Decade', r:46, spd:0.35,maxHp:35, col:'#ff1155', val:52560, glow:'#ff4477' },
};

// ─── Helpers ─────────────────────────────────────────────────────────────────
function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a,b){ return Math.floor(rand(a,b+1)); }

function formatTime(sec) {
  if (sec < 60) return `${sec}s`;
  if (sec < 3600) return `${Math.floor(sec/60)}m ${sec%60}s`;
  if (sec < 86400) return `${Math.floor(sec/3600)}h`;
  if (sec < 525600) return `${Math.floor(sec/1440)}d`;
  return `${Math.floor(sec/525600)}yr`;
}

function edgeSpawn() {
  const side = randInt(0, 3);
  if (side===0) return { x: rand(0,W), y:-60 };
  if (side===1) return { x: W+60,     y: rand(0,H) };
  if (side===2) return { x: rand(0,W), y: H+60 };
  return              { x:-60,         y: rand(0,H) };
}

function spawnEnemy(type) {
  const t = TYPES[type];
  const p = edgeSpawn();
  enemies.push({
    ...t, type,
    x: p.x, y: p.y,
    hp: t.maxHp,
    wobble: rand(0, Math.PI*2),
    wSpd: rand(0.04, 0.09),
    flash: 0,
    dmgTimer: 0,
  });
}

function spawnWave(w) {
  const base = 6 + w * 3;
  for (let i = 0; i < base; i++) {
    const delay = i * 250;
    let type;
    const r = Math.random();
    if (w <= 2)       type = 'minute';
    else if (w <= 5)  type = r < 0.55 ? 'minute' : 'hour';
    else if (w <= 9)  type = r < 0.35 ? 'minute' : r < 0.75 ? 'hour' : 'day';
    else              type = r < 0.25 ? 'minute' : r < 0.6  ? 'hour' : 'day';
    setTimeout(() => { if (gs==='playing') spawnEnemy(type); }, delay);
  }
  if (w % 5 === 0) {
    setTimeout(() => { if (gs==='playing') spawnEnemy('boss'); }, base * 250 + 600);
  }
}

function spawnParticles(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI*2);
    const sp = rand(2, 5);
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: rand(25,50), maxLife: 50, col, r: rand(2,5) });
  }
}

function floatText(x, y, text, col) {
  floatTexts.push({ x, y, text, col, life: 55, maxLife: 55, vy: -1.2 });
}

function doAttack() {
  if (player.cd > 0) return;
  const a = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  player.angle = a;
  slashFX.push({ x: player.x, y: player.y, angle: a, r: player.atkR, life: 16, maxLife: 16 });
  let hit = false;
  enemies.forEach(e => {
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    if (d < player.atkR + e.r) {
      e.hp--;
      e.flash = 10;
      hit = true;
      if (e.hp <= 0) {
        score += e.val;
        spawnParticles(e.x, e.y, e.col, 10);
        floatText(e.x, e.y - e.r - 5, `+${formatTime(e.val)}`, e.col);
      }
    }
  });
  enemies = enemies.filter(e => e.hp > 0);
  player.cd = player.maxCd;
}

// ─── Update ──────────────────────────────────────────────────────────────────
function update() {
  if (gs !== 'playing') return;

  // Player follows mouse
  const dx = mouse.x - player.x, dy = mouse.y - player.y;
  const d = Math.hypot(dx, dy);
  if (d > 4) {
    player.x += (dx/d) * player.speed;
    player.y += (dy/d) * player.speed;
    player.angle = Math.atan2(dy, dx);
  }
  player.x = Math.max(player.r, Math.min(W - player.r, player.x));
  player.y = Math.max(player.r, Math.min(H - player.r, player.y));
  if (player.cd > 0) player.cd--;

  // Enemies
  enemies.forEach(e => {
    e.wobble += e.wSpd;
    const ex = player.x - e.x, ey = player.y - e.y;
    const ed = Math.hypot(ex, ey);
    e.x += (ex/ed) * e.spd;
    e.y += (ey/ed) * e.spd;
    if (e.flash > 0) e.flash--;
    // Damage player
    if (ed < player.r + e.r) {
      if (e.dmgTimer <= 0) {
        player.hp -= (e.type === 'boss' ? 8 : e.type === 'day' ? 5 : e.type === 'hour' ? 2.5 : 1.5);
        e.dmgTimer = 20;
      }
    }
    if (e.dmgTimer > 0) e.dmgTimer--;
  });

  if (player.hp <= 0) {
    player.hp = 0;
    gs = 'gameover';
    if (score > highScore) highScore = score;
    deathMsg = DEATH_MSGS[randInt(0, DEATH_MSGS.length-1)];
    return;
  }

  // Particles
  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.91; p.vy *= 0.91;
    return --p.life > 0;
  });
  slashFX = slashFX.filter(s => --s.life > 0);
  floatTexts = floatTexts.filter(f => { f.y += f.vy; return --f.life > 0; });

  // Wave logic
  if (enemies.length === 0 && !waveBreak) {
    waveBreak = true;
    waveTimer = 210;
    // Heal a bit between waves
    player.hp = Math.min(player.maxHp, player.hp + 15);
  }
  if (waveBreak) {
    if (--waveTimer <= 0) {
      waveBreak = false;
      wave++;
      spawnWave(wave);
    }
  }
}

// ─── Draw ─────────────────────────────────────────────────────────────────────
const BG_GRAD = (() => {
  const g = ctx.createRadialGradient(W/2,H/2,H*0.1, W/2,H/2,H*0.85);
  g.addColorStop(0, '#040f08');
  g.addColorStop(1, '#010301');
  return g;
})();

function drawBG() {
  ctx.fillStyle = BG_GRAD;
  ctx.fillRect(0,0,W,H);
  // Grid
  ctx.strokeStyle = 'rgba(0,255,100,0.035)';
  ctx.lineWidth = 1;
  const gs = 44;
  for (let x=0; x<W; x+=gs) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y=0; y<H; y+=gs) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  // Pulse rings
  const t = Date.now() * 0.0005;
  for (let i=0; i<3; i++) {
    const phase = (t + i/3) % 1;
    ctx.beginPath();
    ctx.arc(W/2, H/2, phase * H * 0.8, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(0,255,100,${(1-phase)*0.03})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function drawPlayer() {
  const { x, y, r, atkR, cd, maxCd, angle } = player;
  // Attack ring
  const cdRatio = cd / maxCd;
  ctx.beginPath();
  ctx.arc(x, y, atkR, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(0,255,136,${0.08 + (1 - cdRatio) * 0.1})`;
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 6]);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.save();
  ctx.translate(x, y);
  // Glow
  ctx.shadowBlur = 25; ctx.shadowColor = '#00ff88';
  // Body
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI*2);
  ctx.fillStyle = '#00ff88';
  ctx.fill();
  // Doctor cross
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#020a05';
  ctx.fillRect(-3, -r*0.55, 6, r*1.1);
  ctx.fillRect(-r*0.55, -3, r*1.1, 6);
  // Scalpel arm pointing at mouse
  ctx.rotate(angle);
  ctx.fillStyle = '#00ffcc';
  ctx.shadowBlur = 10; ctx.shadowColor = '#00ffcc';
  ctx.fillRect(r-2, -2, 22, 4);
  ctx.fillStyle = '#ccffee';
  ctx.beginPath();
  ctx.moveTo(r+20, -4); ctx.lineTo(r+28, 0); ctx.lineTo(r+20, 4);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawEnemies() {
  const t = Date.now() * 0.001;
  enemies.forEach(e => {
    ctx.save();
    ctx.translate(e.x, e.y + Math.sin(e.wobble) * 2.5);
    const flash = e.flash > 0 && e.flash % 2 === 0;
    ctx.shadowBlur = 18; ctx.shadowColor = e.glow;
    // Body
    ctx.beginPath();
    ctx.arc(0, 0, e.r, 0, Math.PI*2);
    ctx.fillStyle = flash ? '#ffffff' : e.col;
    ctx.fill();
    // Inner clock circle
    ctx.strokeStyle = flash ? '#fff' : 'rgba(0,0,0,0.45)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, e.r * 0.68, 0, Math.PI*2);
    ctx.stroke();
    // Broken clock hands
    ctx.shadowBlur = 0;
    ctx.lineWidth = e.r > 25 ? 2.5 : 1.8;
    ctx.strokeStyle = 'rgba(0,0,0,0.65)';
    const h1 = t * 0.4 + e.wobble;
    const h2 = t * 1.8 - e.wobble * 0.5;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(h1)*e.r*0.52, Math.sin(h1)*e.r*0.52); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(h2)*e.r*0.35, Math.sin(h2)*e.r*0.35); ctx.stroke();
    // HP bar
    if (e.hp < e.maxHp) {
      const bw = e.r*2;
      ctx.fillStyle = '#1a0000';
      ctx.fillRect(-bw/2, -e.r-10, bw, 5);
      ctx.fillStyle = '#ff1144';
      ctx.fillRect(-bw/2, -e.r-10, bw*(e.hp/e.maxHp), 5);
    }
    // Boss label
    if (e.type === 'boss') {
      ctx.fillStyle = '#ff4477';
      ctx.font = 'bold 11px "Space Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('BOSS', 0, -e.r - 14);
    }
    ctx.restore();
  });
}

function drawSlash() {
  slashFX.forEach(s => {
    const a = s.life / s.maxLife;
    ctx.save();
    ctx.translate(s.x, s.y); ctx.rotate(s.angle);
    ctx.beginPath();
    ctx.arc(0, 0, s.r, -Math.PI/2.8, Math.PI/2.8);
    ctx.strokeStyle = `rgba(0,255,200,${a * 0.9})`;
    ctx.lineWidth = 4 * a;
    ctx.shadowBlur = 30 * a; ctx.shadowColor = '#00ffcc';
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();
  });
}

function drawParticles() {
  particles.forEach(p => {
    const a = p.life / p.maxLife;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * a, 0, Math.PI*2);
    const hex = Math.floor(a * 255).toString(16).padStart(2,'0');
    ctx.fillStyle = p.col + hex;
    ctx.fill();
  });
}

function drawFloatTexts() {
  floatTexts.forEach(f => {
    const a = f.life / f.maxLife;
    ctx.font = `bold 13px "Space Mono", monospace`;
    ctx.fillStyle = f.col + Math.floor(a*255).toString(16).padStart(2,'0');
    ctx.textAlign = 'center';
    ctx.shadowBlur = 8 * a; ctx.shadowColor = f.col;
    ctx.fillText(f.text, f.x, f.y);
    ctx.shadowBlur = 0;
  });
  ctx.textAlign = 'left';
}

function drawHUD() {
  // Health bar
  const bw = 210, bh = 13, bx = 16, by = 26;
  const hRatio = player.hp / player.maxHp;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(bx-2, by-2, bw+4, bh+4);
  ctx.fillStyle = '#1a0005';
  ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = `hsl(${hRatio * 130}, 100%, 45%)`;
  ctx.fillRect(bx, by, bw * hRatio, bh);
  // Scanline effect on bar
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  for (let i=0; i<bw*hRatio; i+=4) ctx.fillRect(bx+i, by, 2, bh);

  ctx.font = '10px "Space Mono", monospace';
  ctx.fillStyle = '#aaffcc';
  ctx.fillText('TIMELINE INTEGRITY', bx, by - 6);

  // Right panel
  ctx.textAlign = 'right';
  ctx.font = 'bold 13px "Space Mono", monospace';
  ctx.fillStyle = '#00ff88';
  ctx.shadowBlur = 8; ctx.shadowColor = '#00ff88';
  ctx.fillText(`WAVE ${wave}`, W-16, 28);
  ctx.shadowBlur = 0;
  ctx.font = '11px "Space Mono", monospace';
  ctx.fillStyle = '#88ffaa';
  ctx.fillText(`${formatTime(score)} SAVED`, W-16, 46);
  ctx.textAlign = 'left';

  // Cooldown bar under player
  if (player.cd > 0) {
    const cdW = 70, cdH = 5;
    const cx = player.x - cdW/2, cy = player.y + player.r + 8;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(cx, cy, cdW, cdH);
    ctx.fillStyle = '#00ffcc';
    ctx.fillRect(cx, cy, cdW * (1 - player.cd/player.maxCd), cdH);
  }

  // Wave break banner
  if (waveBreak) {
    const secs = Math.ceil(waveTimer / 60);
    ctx.textAlign = 'center';
    ctx.font = 'bold 22px "Creepster", serif';
    ctx.fillStyle = '#00ff88';
    ctx.shadowBlur = 20; ctx.shadowColor = '#00ff88';
    const msg = secs > 0 ? `NEXT WAVE IN ${secs}s  •  +15 HP RESTORED` : 'INCOMING!';
    ctx.fillText(msg, W/2, H - 28);
    ctx.shadowBlur = 0;
    ctx.textAlign = 'left';
  }

  // Enemy count
  if (!waveBreak && enemies.length > 0) {
    ctx.textAlign = 'center';
    ctx.font = '10px "Space Mono", monospace';
    ctx.fillStyle = 'rgba(255,100,100,0.7)';
    ctx.fillText(`${enemies.length} HOSTILES REMAINING`, W/2, H-16);
    ctx.textAlign = 'left';
  }
}

// ─── Screens ─────────────────────────────────────────────────────────────────
function drawMenu() {
  drawBG();
  const t = Date.now() * 0.001;
  const cx = W/2, cy = H/2;

  // Decorative zombie clock
  ctx.save();
  ctx.translate(cx, cy - 20);
  for (let i=0; i<12; i++) {
    const a = (i/12)*Math.PI*2 - Math.PI/2;
    const r1=75, r2=82;
    ctx.strokeStyle = `rgba(0,255,136,${0.3 + Math.sin(t*2+i)*0.15})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*r1, Math.sin(a)*r1);
    ctx.lineTo(Math.cos(a)*r2, Math.sin(a)*r2);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.arc(0,0,72,0,Math.PI*2);
  ctx.strokeStyle = 'rgba(0,255,136,0.18)';
  ctx.lineWidth = 2;
  ctx.stroke();
  // Hour hand (slow, rotting)
  ctx.save(); ctx.rotate(t * 0.15 + 1.2);
  ctx.strokeStyle = 'rgba(0,255,136,0.4)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-45); ctx.stroke();
  ctx.restore();
  // Minute hand
  ctx.save(); ctx.rotate(t * 0.9 - 0.8);
  ctx.strokeStyle = 'rgba(0,255,200,0.5)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-60); ctx.stroke();
  ctx.restore();
  ctx.restore();

  // Title
  ctx.textAlign = 'center';
  ctx.font = '62px "Creepster", serif';
  ctx.shadowBlur = 40; ctx.shadowColor = '#00ff88';
  ctx.fillStyle = '#00ff88';
  ctx.fillText('DEAD ON TIME', cx, cy - 118);
  ctx.shadowBlur = 0;

  ctx.font = '12px "Space Mono", monospace';
  ctx.fillStyle = 'rgba(170,255,204,0.7)';
  ctx.fillText('A surgical strike against the zombie apocalypse of wasted minutes', cx, cy - 90);

  // Story blurb
  const lines = [
    'Time has gone zombie. It drags. It moans. It eats your productivity.',
    'You are the surgeon of seconds. Scalpel in hand. Grudge in heart.',
    'Every minute you save becomes a weapon. Every wasted hour — a boss fight.',
  ];
  ctx.font = '11px "Space Mono", monospace';
  ctx.fillStyle = 'rgba(120,220,150,0.55)';
  lines.forEach((l, i) => ctx.fillText(l, cx, cy + 48 + i * 18));

  // Start button with pulse
  const pulse = 0.5 + 0.5 * Math.sin(t * 3);
  ctx.font = 'bold 26px "Creepster", serif';
  ctx.fillStyle = `rgba(0,${Math.floor(200+55*pulse)},${Math.floor(100+80*pulse)},1)`;
  ctx.shadowBlur = 20 * pulse; ctx.shadowColor = '#00ff88';
  ctx.fillText('[ CLICK TO BEGIN THE SURGERY ]', cx, cy + 120);
  ctx.shadowBlur = 0;

  if (highScore > 0) {
    ctx.font = '11px "Space Mono", monospace';
    ctx.fillStyle = '#ffd700';
    ctx.fillText(`⭐  RECORD: ${formatTime(highScore)} SAVED`, cx, cy + 148);
  }

  ctx.font = '10px "Space Mono", monospace';
  ctx.fillStyle = 'rgba(100,180,130,0.45)';
  ctx.fillText('MOVE: mouse hover  •  ATTACK: click  •  AIM: cursor direction', cx, cy + 172);
  ctx.textAlign = 'left';
}

function drawGameOver() {
  drawBG();
  const cx = W/2, cy = H/2;
  ctx.textAlign = 'center';

  ctx.font = '58px "Creepster", serif';
  ctx.fillStyle = '#ff1144';
  ctx.shadowBlur = 40; ctx.shadowColor = '#ff0033';
  ctx.fillText('TIME OF DEATH', cx, cy - 100);
  ctx.shadowBlur = 0;

  ctx.font = '13px "Space Mono", monospace';
  ctx.fillStyle = '#ffaacc';
  ctx.fillText(deathMsg, cx, cy - 62);

  ctx.font = '11px "Space Mono", monospace';
  ctx.fillStyle = 'rgba(200,150,170,0.6)';
  ctx.fillText(`Reached Wave ${wave}`, cx, cy - 38);

  // Score
  ctx.font = 'bold 30px "Creepster", serif';
  ctx.fillStyle = '#00ff88';
  ctx.shadowBlur = 15; ctx.shadowColor = '#00ff88';
  ctx.fillText(`TIME SAVED: ${formatTime(score)}`, cx, cy + 10);
  ctx.shadowBlur = 0;

  if (score >= highScore && score > 0) {
    ctx.font = 'bold 20px "Creepster", serif';
    ctx.fillStyle = '#ffd700';
    ctx.shadowBlur = 20; ctx.shadowColor = '#ffd700';
    ctx.fillText('⭐  NEW RECORD  ⭐', cx, cy + 48);
    ctx.shadowBlur = 0;
  } else if (highScore > 0) {
    ctx.font = '11px "Space Mono", monospace';
    ctx.fillStyle = 'rgba(180,180,100,0.6)';
    ctx.fillText(`Best: ${formatTime(highScore)}`, cx, cy + 48);
  }

  const t = Date.now() * 0.001;
  const pulse = 0.5 + 0.5 * Math.sin(t * 2.5);
  ctx.font = 'bold 24px "Creepster", serif';
  ctx.fillStyle = `rgba(0,${Math.floor(180+75*pulse)},${Math.floor(80+76*pulse)},1)`;
  ctx.shadowBlur = 15 * pulse; ctx.shadowColor = '#00ff88';
  ctx.fillText('[ CLICK TO TRY AGAIN ]', cx, cy + 108);
  ctx.shadowBlur = 0;

  ctx.textAlign = 'left';
}

// ─── Game Loop ────────────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0,0,W,H);
  if (gs === 'menu') { drawMenu(); return; }
  if (gs === 'gameover') { drawGameOver(); return; }
  drawBG();
  drawParticles();
  drawSlash();
  drawEnemies();
  drawPlayer();
  drawFloatTexts();
  drawHUD();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function startGame() {
  gs = 'playing';
  wave = 1; score = 0;
  enemies = []; particles = []; slashFX = []; floatTexts = [];
  player.x = W/2; player.y = H/2;
  player.hp = player.maxHp;
  player.cd = 0;
  waveBreak = false;
  spawnWave(1);
}

// ─── Events ───────────────────────────────────────────────────────────────────
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
});

canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
  if (gs === 'menu' || gs === 'gameover') startGame();
  else if (gs === 'playing') doAttack();
});

// Touch support
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  mouse.x = e.touches[0].clientX - r.left;
  mouse.y = e.touches[0].clientY - r.top;
}, { passive: false });

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  mouse.x = e.touches[0].clientX - r.left;
  mouse.y = e.touches[0].clientY - r.top;
  if (gs === 'menu' || gs === 'gameover') startGame();
  else if (gs === 'playing') doAttack();
}, { passive: false });

loop();
</script>
